# What this mod is. These become info.json.
[mod]
name = "better-belt-balancer"
version = "0.2.1"
title = "Better Belt Balancer"
author = "Techrocket9"
description = "Belt balancers that click together into arbitrary shapes. Highly performant; megabase-ready (UPS hit is ~equal to vanilla hand-crafted belt balancers)."
# TRUNK TARGETS 2.1, and it is one value per release: the portal serves the
# right release per game version, so the 2.0 arm is a `release/2.0` branch
# carrying this key, the 2.0.77 api pin and its generated bindings, and nothing
# hand-written. The mod-data tree is IDENTICAL on both branches -- the
# engine-version guard in guest/go/engine is what makes one tree correct
# on both engines. See agents/single-edge.md, "Packaging: one tree, two
# releases".
factorio_version = "2.0"
# The mod's ASSETS -- graphics, locale, changelog, thumbnail, and since the
# data-stage purge NOTHING ELSE. `fklua mod` generates the control stage and
# rm -rf's its output directory first, so nothing hand-written can live there;
# this key is the default for --include, and the tree is merged into the package
# before either writer runs -- so `--zip` carries it too.
#
# It used to carry ten hand-written Lua files, which is what `data_module` below
# replaced. The two keys do not overlap and cannot: an included file named
# `data.lua`, `settings.lua` or `data-final-fixes.lua` COLLIDES with the stage
# file the data module generates, and `fklua mod` reports that as an error at
# package time rather than picking a winner.
data = "mod-data"
# info.json's dependencies, verbatim. The data stage extends base prototypes.
dependencies = ["base >= 2.0.0"]

# The API version the generated bindings come from.
# PINNED: `fklua gen-bindings --check` fails if the tree drifts from it,
# and `fklua api check --to <newer>` says whether an upgrade would break
# anything this mod actually calls.
[fklua]
api = "2.0.77"
# GO ALONE, and this repository is PURE GO: the shipped guest, the data guest
# and all fourteen test observers are the one language.
#
# It read `["go", "rust"]` for one day. Phase 8 of the estate port wrote the
# `mig21` observer a second time in Rust and staged it, to hold FkLua's Go/Rust
# member-id parity against a REAL engine rather than only against the mirror
# tests' host stub. THE MEASUREMENT SUCCEEDED -- 51 tagged log lines over two
# committed fixtures, byte-identical with no mask at all, and a packaged
# `fk_api_gen.lua` identical across the two backends -- and it is a COMPLETED
# MEASUREMENT rather than a standing exercise. Continuous Rust coverage for
# FkLua belongs to the fklua-ports repositories, which exist for it; this mod
# reverted to one language on 2026-08-26. The Rust tree is recoverable from git
# history at 5f91937 and agents/estate-port.md's phase 8 records what it
# measured.
lang = ["go"]

# THE DATA GUEST: a SECOND wasm module, which becomes the mod's settings.lua,
# data.lua and data-final-fixes.lua. `guest/go/data` is its source and it is a
# second `main` package inside the one guest module, so it shares
# guest/go/engine and guest/go/skin with the control guest.
#
# `fklua mod` writes a stage file per hook the module EXPORTS and for no others,
# so there is no data-updates.lua in the package and nothing here wants one.
#
# It is a separate module from the control guest rather than more exports on it,
# and that is measured rather than tidy: sharing would parse and instantiate a
# 3 MB program at every data-family stage -- +150 ms per game load, per stage,
# for a program the stage never calls -- and would run the control guest's
# package initialisers against a runtime API that does not exist there.
# `fklua mod` refuses a data module that imports fkapi at all, which is the same
# rule enforced rather than advised. See FkLua's docs/data-stage.md.
#
# It is always built -gc=leaking and packaged --persist=none whatever the
# control guest's arms are, because it runs once and dies with the Lua state
# that built it -- so the Makefile's GC= stamp does not reach it.
data_module = "dist/bbbdata.wasm"

# How the GUEST's own heap is managed, and it must match how the guest was
# BUILT: "collected" means `tinygo -gc=custom` plus an import of
# guest/go/fkgc (guest/go/gc.go is this mod's). `fklua mod` refuses
# "collected" for a module that exports no collector, so a mismatch is a build
# error and never a mod that silently fails to collect.
#
# COLLECTED IS THE SHIPPED ARM, decided three times and re-measured each time;
# CLAUDE.md's "The third decision" is the one that flipped it and the Makefile's
# GC block is the short form. `make GC=leaking` builds the other arm, which
# stays green on all seven suites, by passing `--gc=leaking` here on the command
# line -- a flag overrides this key, which is what makes one manifest able to
# describe the arm that ships while the other stays buildable from the same
# tree.
gc = "collected"

# THERE IS NO `persist` KEY and that is not an omission: `--persist` is a
# command-line flag with no manifest form, so the Makefile passes
# `--persist=packed` on every invocation. See the Makefile's PERSIST block for
# why packed, which is also a decision taken three times.
