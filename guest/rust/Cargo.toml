# THE RUST HALF OF THE TEST ESTATE, and it is one observer.
#
# `guest/rust` beside `guest/go` is not a preference: `fklua gen-bindings`
# writes the Rust bindings to exactly `guest/rust/fkapi`, the way it writes the
# Go ones to exactly `guest/go/fkapi`, and `fklua lock` hashes both at those
# names. A project that put its Rust guest anywhere else would orphan the
# generated crate -- which is the defect FkLua's own scaffold shipped with for a
# milestone (agents/guests.md, "guest/go rather than guest").
#
# WHY THERE IS A RUST ARM AT ALL. FkLua maintains Go/Rust member-id parity and
# checks it with mirror tests against a host stub; what those cannot reach is a
# real engine, real fixtures and a transcript somebody is holding to the byte.
# `obs/mig21` is that: the same observer as `guest/go/obs/mig21` was, producing
# the same 51 lines, on the same two saves. See agents/estate-port.md, phase 8.
[workspace]
resolver = "2"
members = ["fkapi", "obs/mig21"]

# Not a preference either, and each line is load-bearing for a guest that ships
# into a game's tick loop:
#
#   panic = "abort"   there is no unwinding across the wasm boundary. FkLua
#                     compiles a trap, and a mod that unwound mid-tick would
#                     have nowhere to unwind to.
#   opt-level = "s"   the generated Lua is PARSED BY THE GAME AT LOAD, so
#                     module size is load time.
#   lto / codegen-units = 1
#                     the pin stamp is an EXPORT rather than a call precisely
#                     because these delete anything merely defined.
#
# Copied from FkLua's own guest/rust workspace, which is where the reasoning is.
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
