[entity-name]
bbb-balancer-part=Balancer part
# The four hidden prototypes have no player-facing surface -- no selection box,
# no item, blanked pictures -- but the ENGINE still names them in its own
# messages: try to build over a balancer part and "X is in the way" fires once
# per colliding entity, which includes the invisible edge interfaces standing
# on that tile. Without these entries that rendered as
# 'Unknown key: "entity-name.bbb-linked-belt"' (field report, 2026-08-05).
# "Balancer" is deliberate: the player sees one machine, so anything of ours
# in their way IS the balancer as far as they know.
bbb-linked-belt=Balancer
bbb-belt=Balancer
bbb-splitter=Balancer
bbb-lane-splitter=Balancer
bbb-legacy-stub=Balancer migration marker
# THE LEGACY STUB'S NAME IS THE INCUMBENT'S OWN ENGLISH TEXT, VERBATIM, and that
# is the whole reason there is an entry at all. `balancer-part` is Belt Balancer
# 2's and Belt Balancer 3's prototype while either is installed, and this mod
# loads after both -- so a different string here would rename a working mod's
# entity in its own player's UI. Identical text makes the override a no-op, and
# no non-English file is shipped, so every translation the incumbent has keeps
# winning by fallback. When the incumbent is gone the stub is ours, and it
# stands for at most one load before the guest converts it.
balancer-part=Balancer Part

[entity-description]
bbb-balancer-part=Place several next to each other and they become one balancer. The belts feeding it are its inputs, the belts it feeds are its outputs.

