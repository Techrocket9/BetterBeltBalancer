[entity-name]
bbb-balancer-part=Balancer part
# The four hidden prototypes have no player-facing surface -- no selection box,
# no item, blanked pictures -- but the ENGINE still names them in its own
# messages: try to build over a balancer part and "X is in the way" fires once
# per colliding entity, which includes the invisible edge interfaces standing
# on that tile. Without these entries that rendered as
# 'Unknown key: "entity-name.bbb-linked-belt"' (field report, 2026-08-05).
# "Balancer" is deliberate: the player sees one machine, so anything of ours
# in their way IS the balancer as far as they know.
bbb-linked-belt=Balancer
bbb-belt=Balancer
bbb-splitter=Balancer
bbb-lane-splitter=Balancer
bbb-legacy-stub=Balancer migration marker
# THE LEGACY STUB'S NAME IS THE INCUMBENT'S OWN ENGLISH TEXT, VERBATIM, and that
# is the whole reason there is an entry at all. `balancer-part` is Belt Balancer
# 2's and Belt Balancer 3's prototype while either is installed, and this mod
# loads after both -- so a different string here would rename a working mod's
# entity in its own player's UI. Identical text makes the override a no-op, and
# no non-English file is shipped, so every translation the incumbent has keeps
# winning by fallback. When the incumbent is gone the stub is ours, and it
# stands for at most one load before the guest converts it.
balancer-part=Balancer Part

[entity-description]
bbb-balancer-part=Place several next to each other and they become one balancer. The belts feeding it are its inputs, the belts it feeds are its outputs.

[item-name]
bbb-balancer-part=Balancer part

[item-description]
bbb-balancer-part=A 1x1 tile that joins with any adjacent balancer part. Belt orientation alone decides which side is an input and which is an output.

[recipe-name]
bbb-balancer-part=Balancer part

[technology-name]
bbb-balancer=Belt balancer

[technology-description]
bbb-balancer=Balancers of any shape, built one tile at a time.

[bbb]
# Shown to the player who laid the belt (or the part) that would have taken a
# balancer past the limit. __1__ is the limit and __2__ is the belt count the
# player's shape would actually have on its bigger side -- BELTS, never ports:
# a player placed one belt and has no window into the compiler, so the first
# cut of this string ("would need 128 ports") read as gibberish in the field
# (report, 2026-08-05). The piece IS handed back a tick later, and the text
# deliberately does not say so: at game speed the place-and-revert is
# invisible, so to the player this is a placement that simply failed, and a
# message narrating an inventory round-trip they never saw reads as a
# transaction to go looking for (same report, second note). State the rule,
# like vanilla does, and stop.
over-port-limit=A balancer connects at most __1__ belts per side; this one would have __2__.
# The same refusal with nobody to hand the piece back to: a construction robot
# or another mod built it, so it is left standing and disconnected.
over-port-limit-unconnected=A balancer connects at most __1__ belts per side; this one would have __2__. The extra piece was left in place, unconnected.
# THE OTHER BOUND, and the one Factorio 2.1 forces: a balancer part carries one
# interface, so it serves one belt. __1__ is how many belts the worst part in
# this balancer would have -- BELTS and PARTS, never edges or interfaces, which
# are words for things the player cannot see. Same silence about the hand-back
# as the pair above and for the same reason. agents/single-edge.md is why the
# rule exists at all.
single-edge-refused=Each balancer part connects to one belt. A part in this balancer would have __1__.
single-edge-refused-unconnected=Each balancer part connects to one belt. A part in this balancer would have __1__. The extra piece was left in place, unconnected.
# THE MIGRATION SUMMARY: a save built under Factorio 2.0's multi-edge rule and
# opened on 2.1, where the engine itself deleted all but one belt-connectable
# per tile before any script ran. __1__ is how many balancers need rebuilding
# and __2__ is a list of [gps=...] pings, one per balancer, so that a big base
# is a checklist rather than a scavenger hunt.
#
# IT SAYS WHERE THE ITEMS WENT, because a player who finds a stopped balancer
# and a heap on the floor beside it will otherwise assume the mod threw them
# away. It does NOT name a setting: on 2.1 there is no setting, and pointing at
# a menu entry that is not there is worse than saying nothing.
single-edge-migrated=__1__ of your balancers connect several belts to one part, which Factorio 2.1 does not allow -- each part now connects to one belt. They have stopped, and what they were holding is on the ground beside them. Rebuild them one belt per part: __2__
# THE SAME SUMMARY FOR A BALANCER THAT NEVER HAD A NETWORK TO LOSE -- which is
# what a Belt Balancer 2 or 3 save reaches. Those parts became ours seconds
# earlier and the very next compile refused them, so there was no teardown, no
# spill and nothing on the floor: their items are on the player's own belts,
# untouched. The clause above would be a sentence about an event that never
# happened, which is the exact defect this pair was split to close.
single-edge-migrated-untouched=__1__ of your balancers connect several belts to one part, which Factorio 2.1 does not allow -- each part now connects to one belt. They have stopped; the items on their belts are untouched. Rebuild them one belt per part: __2__
# THE GRANDFATHER WARNING, on Factorio 2.0 only: the same shape found on an
# engine that CAN still stack, so the mod keeps this save working instead of
# stopping it. Said once, on the load that decides; while the setting stays on
# the mod is quiet, because a warning on every load is a nag.
#
# It names the settings path because the flip back is the player's to make and
# needs no restart -- and it deliberately does not offer to make it for them: a
# silent downgrade under somebody relying on multi-edge is a trap.
#
# IT IS ALSO WHAT A REFUSED FLIP-OFF SAYS, and that is why the middle clause is
# there. Turning the setting off while these balancers are standing is VETOED --
# the mod writes it straight back on rather than demolishing a working base --
# so one sentence has to be true both of the load that decides and of the
# keypress that is declined.
#
# __2__ IS A PING PER BALANCER, added 2026-08-24 after a live session produced
# this message naming twenty machines and pointing at none of them. __1__ is
# exact; the ping list is capped at what one readable chat line holds, and the
# guest's own log line says how many really went out.
single-edge-grandfathered=__1__ of your balancers connect several belts to one part. This save keeps working, but new balancers connect one belt per part, and THESE WILL STOP WORKING ON FACTORIO 2.1. Turning the setting off is refused while they are standing: rebuild them one belt per part first, then turn off "Allow multiple belts per balancer part" in Settings > Mod settings > Map. __2__

[mod-setting-name]
# THE TWO COST SETTINGS, and unlike the bool above they exist on BOTH engines:
# what a balancer part costs to build and to research means the same thing on
# 2.0 as on 2.1. Both are STARTUP settings, because a recipe and a technology
# are prototypes and a prototype is decided before the map exists -- so both
# default to what this mod has always shipped, which is what keeps a save built
# on an earlier version identical after the update.
bbb-recipe-cost=Balancer part recipe
# The field beside the recipe setting, used only while that setting is set to
# Custom. It is named for what it decides rather than for what it is: a player
# reading down the Startup tab sees the recipe row and then the recipe they can
# write, which is the same row twice on purpose.
#
# ITS KEY CARRIES THE MOD PREFIX AND THE TWO DROPDOWNS' DO NOT, which is a
# split with a reason rather than an inconsistency. FkRecipes GENERATES this
# field's name from the packaged mod name and places its row with OrderAfter,
# so the setting is better-belt-balancer-recipe-ingredients and every entry
# here is keyed by that. The two dropdowns keep the names they have always
# shipped, because Factorio stores a player's startup choice by NAME and has no
# rename mechanism: a renamed dropdown is a NEW setting and every stored choice
# is silently discarded. Nothing has ever shipped the four Custom fields, so
# there is no stored value of anybody's to lose and the generated name costs
# nothing. What a player sees is the label below either way.
better-belt-balancer-recipe-ingredients=Custom balancer part recipe
bbb-tech-cost=Balancer research cost
# The three fields beside the research setting, used only while that setting is
# set to Custom, and named the same way the recipe field above is: a player
# reading down the Startup tab sees the research row and then the three numbers
# a research cost is made of. They are three rows rather than one because that
# is what the engine gives: a text field takes the packs, and a count and a time
# are a number each.
#
# All three carry the mod prefix for the reason the recipe field above does,
# and OrderAfter is what keeps them BELOW the research dropdown rather than
# above it: a generated order is derived, and without that call these three
# would sort under the recipe dropdown instead.
better-belt-balancer-tech-packs=Custom balancer research: science packs
better-belt-balancer-tech-count=Custom balancer research: units
better-belt-balancer-tech-seconds=Custom balancer research: seconds per unit
bbb-multi-edge-parts=Allow multiple belts per balancer part (Factorio 2.0 only)

[mod-setting-description]
# THE REASSURANCE IS SCOPED TO THE PRESETS, AND THAT SCOPE IS THE WHOLE POINT
# OF THE 0.3.3 REWRITE. This entry shipped 0.2.2's sentence unchanged through
# the round that added the seventh option, so it promised of EVERY option that
# "if an option names something your mods do not have, the nearest thing they do
# have is used instead". That is true of the six presets, each of whose
# ingredients is a ladder ending at iron plate, and false of the seventh: on
# Custom a name the game lacks is not swapped for a neighbour, the whole typed
# list is set aside and this mod's own declaration applies instead. One sentence
# covered two opposite policies, which is agents/migration-assessment.md
# finding 6.
#
# THE SCOPE IS WRITTEN "EVERY OPTION BUT CUSTOM" RATHER THAN "THE OPTIONS
# LISTED BELOW", because the second is exact in the tooltip and wrong in the
# widget: the composed description carries one label line and one indented
# `type:` line per PRESET and nothing at all for `custom`, so "below" is six
# lines there and seven values in the open dropdown the player reads it beside.
#
# AND "SAFE" IS SAID WITH THE MERGE IN IT, because substitution is not the
# whole of what a pack sees. Where a substitute is an item the list already
# names, the two amounts are ADDED and the recipe keeps one entry, so a pack
# with no transport belts crafts a balancer part out of `6 iron-plate,
# 2 iron-gear-wheel` while the `type:` line beside the label still reads
# `4 iron-plate, 2 iron-gear-wheel, 2 transport-belt`. A sentence that stopped
# at "the nearest thing they do have is used instead" would promise the same
# list with one item swapped and hand the player a shorter one, which is the
# shape of finding 6 all over again. So the clause carries the merge and says
# the crafted list can be shorter than the one shown.
#
# WHAT IT DOES NOT SAY IS AS DELIBERATE AS WHAT IT DOES. The format, the
# 2000-character limit and what becomes of a text this mod cannot use are lines
# FkRecipes composes onto the FIELD's description, and that field is the row
# IMMEDIATELY below this one: `bbb-recipe-cost` orders `a` and
# `better-belt-balancer-recipe-ingredients` orders `aab`, and the client
# rendered the six startup rows `a`, `aab`, `b`, `bad`, `bae`, `baf`. The
# engine's own settings dump says NEITHER dropdown carries those lines.
# Repeating them here would put the field's small print in front of every
# player who only ever picks a preset.
#
# CUSTOM IS NAMED IN THE TWIN'S SHAPE AND IN THE TWIN'S POSITION, first
# sentence: "or Custom to write the recipe yourself in the setting below"
# against `bbb-tech-cost`'s "or Custom to write the cost yourself in the three
# settings below", singular where the twin is plural because there is one field
# and not three. THAT ONE WORD IN THAT ONE POSITION IS ALL THAT IS GATED:
# --dump-data holds the locale KEY and never the string, so `make
# datastage-check` cannot see a syllable of this file, and `go test ./tune/`
# checks that this entry exists and that everything before its FIRST full stop
# names whatever the menu calls the Custom value. Nothing else here is checked:
# every other sentence is read by a human or it is not read.
bbb-recipe-cost=What a balancer part costs to craft, or Custom to write the recipe yourself in the setting below. The default is what this mod has always used. Every option but Custom is safe in an overhaul pack: where one names something your mods do not have, the nearest thing they do have is used instead, and where that leaves one item named twice the two amounts are added, so what you craft can be a shorter list than the one shown here. A recipe you write yourself is the opposite on purpose, and it is taken as written: nothing is substituted for a name you typed.
# ONE LINE, AND IT IS THE ONLY PLACE THE FORMAT IS EXPLAINED. A free-text field
# with no description is a field nobody can fill in, which is why the locale
# check treats this entry as REQUIRED where every other description is optional:
# `go test ./tune/` reports a missing one by name. What the player is not told
# here they have to guess: that the names are the game's internal ones, that the
# word default is this mod's own recipe, and that the recipe setting's own
# tooltip lists every preset written in exactly this language, which is where a
# player who wants to start from one copies it.
#
# The setting's prototype carries this entry and then THREE composed lines: the
# mod's declared list as `default: 4 iron-plate, 2 iron-gear-wheel, 2
# transport-belt`, and since FkRecipes 0077f3c two of the library's own, giving
# the vocabulary and the 2000-character limit and saying what happens to a text
# this mod cannot use. The text below therefore does not repeat the list, the
# limit or the fallback. It does still spell out the SHAPE -- an amount, then a
# name, then a comma -- because the library's line names the vocabulary
# ("internal names") and not the syntax.
#
# The key is the setting's EMITTED name, the generated one; the section above
# says why these four carry the mod prefix and the two dropdowns do not.
better-belt-balancer-recipe-ingredients=What a balancer part is made of while the recipe setting above is set to Custom. Write the amount, then the item's internal name, and separate ingredients with commas: 2 iron-plate, 1 splitter. Internal names are the ones the game uses in its own data and in rich text, not the names shown on screen. The word default means this mod's own recipe, and the tooltip on the setting above lists every preset written this way.
bbb-tech-cost=The balancer is always unlocked by its own research; this picks which logistics tier that research is priced like, or Custom to write the cost yourself in the three settings below. For a tier the cost is copied from that technology, so it follows whatever your mods charge for it, and the balancer's research moves to sit just after it in the technology tree. On Custom it sits after Logistics, the same place the setting's default puts it, so picking Custom does not move it; without Logistics it sits after the lowest of Logistics 2 and Logistics 3 your mods have, and it has no prerequisite if none of the three exists.
# THE PACK LIST IS THE OTHER FREE-TEXT FIELD, so this entry is REQUIRED for the
# same reason the recipe's is: it is the only place the format is explained, and
# `go test ./tune/` reports it missing by name. What is different from the
# recipe field is the vocabulary -- research takes science packs and nothing
# else, so an ordinary item cannot be used here even though the recipe field
# would take it -- and that is the one thing a player cannot guess from the
# recipe field they have already used.
#
# The setting's prototype carries this entry and then THREE composed lines: the
# mod's declared list as `default: 1 automation-science-pack`, and since
# FkRecipes 0077f3c two of the library's own, giving the vocabulary and the
# 2000-character limit and saying what happens to a text this mod cannot use.
# The text below therefore does not repeat the list, the limit or the fallback.
# It does still spell out the SHAPE -- an amount, then a name, then a comma --
# because the library's line names the vocabulary ("internal names") and not
# the syntax. The key is the generated name, as the recipe field's above is.
better-belt-balancer-tech-packs=What the balancer research is paid in while the research setting above is set to Custom. Write the amount, then the pack's internal name, and separate packs with commas: 1 automation-science-pack, 1 logistic-science-pack. Only science packs are accepted, and internal names are the ones the game uses in its own data and in rich text, not the names shown on screen. The word default means this mod's own list.
# The two numbers are one sentence each: the field says what it is, and then
# which setting has to be on Custom for it to do anything. A player who sets a
# number and sees nothing change has been failed by the second half. Both keys
# are generated names, as the two text fields' above are.
better-belt-balancer-tech-count=How many units of science the balancer research costs, while the research setting above is set to Custom.
better-belt-balancer-tech-seconds=How many seconds one unit of the balancer research takes in a lab, while the research setting above is set to Custom.
# Why it is off by default, in the player's terms rather than in the engine's:
# what it costs is that the balancers built with it stop working the day the
# game updates. The setting is not defined at all on 2.1, so nobody reading this
# is on an engine where it could be turned on and then break.
bbb-multi-edge-parts=Off by default. A balancer part normally connects to one belt. Factorio 2.0 can connect several belts to one part, which builds a smaller balancer -- but Factorio 2.1 cannot, and balancers built this way stop working when the game updates. This mod turns it on by itself for a save that already used it.

# EVERY ALLOWED VALUE OF EVERY STRING SETTING NEEDS AN ENTRY HERE, one per
# value, keyed `<setting>-<value>`. There is NO FALLBACK: a value with no entry
# renders in the settings menu the player is standing in as
# `Unknown key: "string-mod-setting.bbb-recipe-cost-cheap"` -- the same defect
# the entity names at the top of this file were added for after a field report
# on 2026-08-05, and one nothing headless can see, because --dump-data does not
# read locale and no suite opens a menu. `go test ./tune/` checks this section
# against the allowed values in BOTH directions, so a missing entry and a
# renamed option both fail the build rather than the menu.
#
# THE INGREDIENTS ARE SPELLED OUT IN THE LABEL because the dropdown is the only
# place a player can see them before committing: Factoriopedia shows the recipe
# that was built, not the five that were not.
#
# AND THE LABELS KEEP THEIR DISPLAY-NAME SPELLING ("4 iron plates, 2 gears")
# NOW THAT THERE IS A TEXT FIELD THAT TAKES INTERNAL NAMES. That is
# agents/migration-assessment.md's item (h), which FkRecipes carries back as
# item 4 of "What BetterBeltBalancer must do to adopt this" ("leave the preset
# labels alone, or rewrite them, but decide it"), and 0.3.3 answers it with
# KEEP, on a measurement rather than on a preference.
#
# A player who copies a label into the field has that text set aside, because
# the field's language takes `iron-plate` and not `iron plates`. What the game
# shows under the label is the same preset in that language: the mod's tooltip
# for this setting is composed from each label and then that preset's internal
# names on their own indented `type:` line, so the two vocabularies sit one
# under the other in the one place a player looks before switching to Custom,
# and the line the mod writes to the log points at the internal name ("no item
# or fluid is named "iron plates"; did you mean iron-plate").
#
# THAT INDENTED LINE IS WHAT DEMOTED THE COMPLAINT. While the two vocabularies
# ran together on one line after a second colon, a display-name label was a
# TRAP: nothing said which half the field would take, which is what finding 5
# measured. Since FkRecipes 0077f3c the copyable half opens its own line under
# an explicit `type:`, so the label is no longer a trap, only the half a player
# cannot paste, and the line beside it is the half they can.
#
# AND REWRITING THEM BUYS ALMOST NOTHING, MEASURED, COUNTER-EVIDENCE INCLUDED.
# The client truncates the CLOSED dropdown at roughly 37 characters (the
# assessment saw `Default: 4 iron plates, 2 gears, 2 tra`, 38 shown, at one UI
# scale, and that is the whole of the evidence for the width, so a label at 38
# is inside that one widget's noise). Counted over this file, TEN OF THIS MOD'S
# ELEVEN dropdown labels are at or past it: the six presets below run 35, 38,
# 50, 52, 58 and 65 characters, only `splitter` at 35 is clearly under,
# `custom` is 52, and all four of `bbb-tech-cost`'s are over at 43, 45, 46
# and 54.
#
# EACH PRESET WAS THEN REWRITTEN IN THE SAME SHAPE and MEASURED: the display
# head, a colon, and that preset's internal list read out of the engine's own
# settings dump. It does NOT lengthen all six.
#
#   vanilla       50 -> 58     cheap              38 -> 37
#   belt-fast     58 -> 66     splitter           35 -> 34
#   belt-express  65 -> 73     splitter-express   52 -> 51
#
# Only `iron-gear-wheel` (15) is longer than its display name `gears` (5).
# Every plural loses a character (`iron plates` to `iron-plate`, `steel plates`
# to `steel-plate`), so the three presets that name a gear, which are also the
# only three with three ingredients, grow by eight, and THE OTHER THREE SHRINK
# BY ONE. That is the counter-evidence and it is worth naming: `cheap` at 38
# would become 37, the one label whose clipping the rewrite could change at
# all, and only if the width is exactly 37 rather than the 38 the client was
# seen rendering. `splitter` fits either way and `splitter-express` at 51 is
# still far over.
#
# WHAT THE REWRITE COSTS IS NOT SYMMETRIC WITH THAT ONE CHARACTER. The three
# that grow go to 58, 66 and 73, past every reading of the width, and they clip
# MID-NAME, unreadable and uncopyable at once; dropping the leading display
# name to buy the characters back costs the closed widget the one thing it can
# still show, which is which option this is; and since FkRecipes 0077f3c gives
# each preset's internal list its own `type:` line in the tooltip, a label in
# internal names would make the tooltip read the same list twice. The dropdown
# is what every player sees and the field is what a few of them edit, so KEEP.
[string-mod-setting]
bbb-recipe-cost-vanilla=Default: 4 iron plates, 2 gears, 2 transport belts
bbb-recipe-cost-cheap=Cheap: 2 iron plates, 1 transport belt
bbb-recipe-cost-belt-fast=Fast belts: 4 iron plates, 2 gears, 2 fast transport belts
bbb-recipe-cost-belt-express=Express belts: 4 steel plates, 2 gears, 2 express transport belts
bbb-recipe-cost-splitter=Splitter: 1 splitter, 2 iron plates
bbb-recipe-cost-splitter-express=Express splitter: 1 express splitter, 2 steel plates
bbb-tech-cost-logistics=Default: Logistics, alongside transport belts
bbb-tech-cost-logistics-2=Logistics 2, alongside fast transport belts
bbb-tech-cost-logistics-3=Logistics 3, alongside express transport belts
