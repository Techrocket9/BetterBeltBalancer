[entity-name]
bbb-balancer-part=Balancer part
# The four hidden prototypes have no player-facing surface -- no selection box,
# no item, blanked pictures -- but the ENGINE still names them in its own
# messages: try to build over a balancer part and "X is in the way" fires once
# per colliding entity, which includes the invisible edge interfaces standing
# on that tile. Without these entries that rendered as
# 'Unknown key: "entity-name.bbb-linked-belt"' (field report, 2026-08-05).
# "Balancer" is deliberate: the player sees one machine, so anything of ours
# in their way IS the balancer as far as they know.
bbb-linked-belt=Balancer
bbb-belt=Balancer
bbb-splitter=Balancer
bbb-lane-splitter=Balancer
bbb-legacy-stub=Balancer migration marker
# THE LEGACY STUB'S NAME IS THE INCUMBENT'S OWN ENGLISH TEXT, VERBATIM, and that
# is the whole reason there is an entry at all. `balancer-part` is Belt Balancer
# 2's and Belt Balancer 3's prototype while either is installed, and this mod
# loads after both -- so a different string here would rename a working mod's
# entity in its own player's UI. Identical text makes the override a no-op, and
# no non-English file is shipped, so every translation the incumbent has keeps
# winning by fallback. When the incumbent is gone the stub is ours, and it
# stands for at most one load before the guest converts it.
balancer-part=Balancer Part

[entity-description]
bbb-balancer-part=Place several next to each other and they become one balancer. The belts feeding it are its inputs, the belts it feeds are its outputs.

[item-name]
bbb-balancer-part=Balancer part

[item-description]
bbb-balancer-part=A 1x1 tile that joins with any adjacent balancer part. Belt orientation alone decides which side is an input and which is an output.

[recipe-name]
bbb-balancer-part=Balancer part

[technology-name]
bbb-balancer=Belt balancer

[technology-description]
bbb-balancer=Balancers of any shape, built one tile at a time.

[bbb]
# Shown to the player who laid the belt (or the part) that would have taken a
# balancer past the limit. __1__ is the limit and __2__ is the belt count the
# player's shape would actually have on its bigger side -- BELTS, never ports:
# a player placed one belt and has no window into the compiler, so the first
# cut of this string ("would need 128 ports") read as gibberish in the field
# (report, 2026-08-05). The piece IS handed back a tick later, and the text
# deliberately does not say so: at game speed the place-and-revert is
# invisible, so to the player this is a placement that simply failed, and a
# message narrating an inventory round-trip they never saw reads as a
# transaction to go looking for (same report, second note). State the rule,
# like vanilla does, and stop.
over-port-limit=A balancer connects at most __1__ belts per side; this one would have __2__.
# The same refusal with nobody to hand the piece back to: a construction robot
# or another mod built it, so it is left standing and disconnected.
over-port-limit-unconnected=A balancer connects at most __1__ belts per side; this one would have __2__. The extra piece was left in place, unconnected.
# THE OTHER BOUND, and the one Factorio 2.1 forces: a balancer part carries one
# interface, so it serves one belt. __1__ is how many belts the worst part in
# this balancer would have -- BELTS and PARTS, never edges or interfaces, which
# are words for things the player cannot see. Same silence about the hand-back
# as the pair above and for the same reason. agents/single-edge.md is why the
# rule exists at all.
single-edge-refused=Each balancer part connects to one belt. A part in this balancer would have __1__.
single-edge-refused-unconnected=Each balancer part connects to one belt. A part in this balancer would have __1__. The extra piece was left in place, unconnected.
# THE MIGRATION SUMMARY: a save built under Factorio 2.0's multi-edge rule and
# opened on 2.1, where the engine itself deleted all but one belt-connectable
# per tile before any script ran. __1__ is how many balancers need rebuilding
# and __2__ is a list of [gps=...] pings, one per balancer, so that a big base
# is a checklist rather than a scavenger hunt.
#
# IT SAYS WHERE THE ITEMS WENT, because a player who finds a stopped balancer
# and a heap on the floor beside it will otherwise assume the mod threw them
# away. It does NOT name a setting: on 2.1 there is no setting, and pointing at
# a menu entry that is not there is worse than saying nothing.
single-edge-migrated=__1__ of your balancers connect several belts to one part, which Factorio 2.1 does not allow -- each part now connects to one belt. They have stopped, and what they were holding is on the ground beside them. Rebuild them one belt per part: __2__
# THE SAME SUMMARY FOR A BALANCER THAT NEVER HAD A NETWORK TO LOSE -- which is
# what a Belt Balancer 2 or 3 save reaches. Those parts became ours seconds
# earlier and the very next compile refused them, so there was no teardown, no
# spill and nothing on the floor: their items are on the player's own belts,
# untouched. The clause above would be a sentence about an event that never
# happened, which is the exact defect this pair was split to close.
single-edge-migrated-untouched=__1__ of your balancers connect several belts to one part, which Factorio 2.1 does not allow -- each part now connects to one belt. They have stopped; the items on their belts are untouched. Rebuild them one belt per part: __2__
# THE GRANDFATHER WARNING, on Factorio 2.0 only: the same shape found on an
# engine that CAN still stack, so the mod keeps this save working instead of
# stopping it. Said once, on the load that decides; while the setting stays on
# the mod is quiet, because a warning on every load is a nag.
#
# It names the settings path because the flip back is the player's to make and
# needs no restart -- and it deliberately does not offer to make it for them: a
# silent downgrade under somebody relying on multi-edge is a trap.
#
# IT IS ALSO WHAT A REFUSED FLIP-OFF SAYS, and that is why the middle clause is
# there. Turning the setting off while these balancers are standing is VETOED --
# the mod writes it straight back on rather than demolishing a working base --
# so one sentence has to be true both of the load that decides and of the
# keypress that is declined.
#
# __2__ IS A PING PER BALANCER, added 2026-08-24 after a live session produced
# this message naming twenty machines and pointing at none of them. __1__ is
# exact; the ping list is capped at what one readable chat line holds, and the
# guest's own log line says how many really went out.
single-edge-grandfathered=__1__ of your balancers connect several belts to one part. This save keeps working, but new balancers connect one belt per part, and THESE WILL STOP WORKING ON FACTORIO 2.1. Turning the setting off is refused while they are standing: rebuild them one belt per part first, then turn off "Allow multiple belts per balancer part" in Settings > Mod settings > Map. __2__

[mod-setting-name]
# THE TWO COST SETTINGS, and unlike the bool above they exist on BOTH engines:
# what a balancer part costs to build and to research means the same thing on
# 2.0 as on 2.1. Both are STARTUP settings, because a recipe and a technology
# are prototypes and a prototype is decided before the map exists -- so both
# default to what this mod has always shipped, which is what keeps a save built
# on an earlier version identical after the update.
bbb-recipe-cost=Balancer part recipe
# The field beside the recipe setting, and it is named for WHAT IT HOLDS rather
# than for when it applies. There is no option left to name it after: the
# dropdown offers six presets and nothing else, and this field takes over
# whenever it does not hold `default`, so a label built on an option word would
# send a player looking for a row the menu does not have. A player reading down
# the Startup tab sees the recipe row and then, directly under it, the
# ingredients they can write into it.
#
# ITS KEY CARRIES THE MOD PREFIX AND THE TWO DROPDOWNS' DO NOT, which is a
# split with a reason rather than an inconsistency. FkRecipes GENERATES this
# field's name from the packaged mod name and places its row with OrderAfter,
# so the setting is better-belt-balancer-recipe-ingredients and every entry
# here is keyed by that. The two dropdowns keep the names they have always
# shipped, because Factorio stores a player's startup choice by NAME and has no
# rename mechanism: a renamed dropdown is a NEW setting and every stored choice
# is silently discarded. Nothing has ever shipped these four fields, so there is
# no stored value of anybody's to lose and the generated name costs nothing.
# What a player sees is the label below either way.
better-belt-balancer-recipe-ingredients=Balancer part ingredients
bbb-tech-cost=Balancer research cost
# The three fields beside the research setting, named for what they hold the
# way the recipe field above is and for the same reason. They are three rows
# rather than one because that is what the engine gives: a text field takes the
# packs, and a count and a time are a number each. EACH IS ITS OWN SWITCH -- the
# pack text on the word `default`, either number on 0, leaves that one field to
# the tier the dropdown picked -- so there is no single state these three are
# ever "in", and no label of theirs claims one.
#
# All three carry the mod prefix for the reason the recipe field above does,
# and OrderAfter is what keeps them BELOW the research dropdown rather than
# above it: a generated order is derived, and without that call these three
# would sort under the recipe dropdown instead.
better-belt-balancer-tech-packs=Balancer research: science packs
better-belt-balancer-tech-count=Balancer research: units
better-belt-balancer-tech-seconds=Balancer research: seconds per unit
bbb-multi-edge-parts=Allow multiple belts per balancer part (Factorio 2.0 only)

[mod-setting-description]
# THE OVERHAUL-PACK RULE IS THE LIBRARY'S SENTENCE NOW AND THIS ENTRY CARRIES
# NO COPY OF IT. FkRecipes 933d4d3 composes onto this very tooltip, in the slot
# between the wrap line and the switch line, `Where an option names something
# your mods do not have, the next name it offers is used instead; an entry it
# offers nothing for is left out, and two that land on one name have their
# amounts added, so what you craft can be a shorter list than the one shown.`
# This entry said the same three things in its own words until 2026-09-14 and
# says none of them now. THREE REASONS FOR DELETING THE COPY RATHER THAN
# KEEPING BOTH. The first is this file's own rule, stated a few lines down and
# applied to itself here: repeating what the library composes prints it twice
# in one tooltip in front of every player who only ever picks a preset. The
# second is drift: the library's sentence is maintained beside the walk that
# resolves the ladders, and this one was maintained here, so the day a rung
# rule changes one copy moves and the other does not. The third is why the
# library has the sentence at all. agents/migration-assessment-3.md finding 22
# was that FkRecipes' own design cited a ladder disclosure THIS FILE was the
# only copy of, which left every other consumer of the library free to write it
# differently or not at all; that is closed from the library's side now, and a
# second copy here re-opens the seam it was closed on.
#
# WHAT THE DELETION DOES NOT GIVE BACK IS FINDING 6, WHICH STAYS CLOSED ON TWO
# THINGS AND NEITHER OF THEM IS THIS TEXT. agents/migration-assessment.md
# finding 6 was a promise of substitution published over a seventh value that
# took the player's own typed list, where a name the game lacks is not swapped
# for a neighbour but sets the whole text aside. THAT VALUE IS GONE since fix
# round 2, so there is no value this dropdown offers that the library's
# sentence is untrue of. And the MERGE, which the scoped promise had to carry
# and which is finding 6's own shape in a second place -- where a substitute is
# an item the list already names the two amounts are ADDED and the recipe keeps
# one entry, so a pack with no transport belts crafts a balancer part out of
# `6 iron-plate, 2 iron-gear-wheel` while the `type:` line beside the label
# still reads `4 iron-plate, 2 iron-gear-wheel, 2 transport-belt` -- is a
# clause of the library's sentence rather than of this one. A library sentence
# that stopped at substitution would promise the same list with one item
# swapped and hand the player a shorter one; FkRecipes' own first draft of it
# stopped there and was amended before the commit, which is why
# the sentence quoted above has three clauses and is 256 bytes for it.
#
# THE SWITCH IS THE TEXT AND NOT AN OPTION, WHICH IS WHY NO SENTENCE HERE NAMES
# ONE. The field below applies whenever it does not hold `default`, and the
# dropdown decides while it does; FkRecipes composes that sentence onto this
# very tooltip, so this entry neither offers an option for it nor repeats it.
# What is left is the contrast a player choosing between the two rows actually
# needs: a preset substitutes, a list you write does not.
#
# WHAT IT DOES NOT SAY IS AS DELIBERATE AS WHAT IT DOES, AND THE COMPOSED LIST
# HAS GROWN AGAIN. Read out of the engine's own settings dump, FkRecipes appends
# to THIS entry one label line and one indented `type:` line per preset, then a
# line saying a list too long for one line continues on the next and the
# continuation is part of the same list, then the LADDER LINE quoted at the top
# of this block, then the line saying the setting below applies instead while it
# does not say `default`. Onto the FIELD's own entry it appends the declared
# list, the same wrap line, the ladder line in the FIELD's own words, the format
# and the 2000-character limit and the word `none`, the switch line likewise (a
# different sentence, written from the field's side) and what becomes of a text
# this mod cannot use. Repeating any of that here would print
# it twice in one tooltip in front of every player who only ever picks a preset.
# This entry ran to 557 characters on one line before fix round 2 withdrew the
# Custom value it described, and to 443 while it still carried the ladder rule
# in this mod's own words. It is 174.
#
# NOTHING GATES THIS PROSE BUT ONE WORD PER ENTRY, AND NOTHING ANYWHERE GATES
# THE DELETION ABOVE. --dump-data holds the locale KEY and never the string, so
# `make datastage-check` cannot see a syllable of this file and no hash in
# test/datastage-goldens.json can move for an edit to it; FkRecipes' own locale
# checker reads keys too.
# TestNoSettingDescriptionNamesAnOptionNoDropdownOffers in
# guest/go/tune/locale_test.go is the whole of what `go test ./tune/` reads
# here, and it reads capitalised words against the option lists this plan
# declares. Every other sentence is read by a human or it is not read.
bbb-recipe-cost=What a balancer part costs to craft. The default is what this mod has always used. A list you write yourself is taken as written: nothing is substituted for a name you typed.
# ONE ENTRY, AND THE SHAPE IS WHAT IS LEFT OF IT. A free-text field with no
# description is a field nobody can fill in, which is why the locale check
# treats this entry as REQUIRED where a bool's or a number's is optional:
# `go test ./tune/` reports a missing one by name.
#
# THE PROTOTYPE CARRIES THIS ENTRY AND THEN SIX COMPOSED LINES, read out of
# the engine's own settings dump: this mod's declared list as
# `default: 4 iron-plate, 2 iron-gear-wheel, 2 transport-belt`; a line saying a
# list too long for one line continues on the next and the continuation is part
# of the same list; the LADDER LINE in this field's own words, saying that where
# a list this mod chose names something your mods do not have the next name it
# offers is used instead, that an entry it offers nothing for is left out, and
# that two landing on one name have their amounts added, so what you craft can
# be a shorter list than the one shown; a line giving the vocabulary and the
# 2000-character limit AND naming the word `none`; a line saying that while this
# field holds `default` the option chosen above applies and anything else
# applies instead of it; and a line saying what becomes of a text this mod
# cannot use. The text below repeats none of the six, which is why it is shorter
# than it was: the list, the wrap, the ladder, the limit, `none`, the switch and
# the fallback are all the library's now. It does still spell out the SHAPE -- an amount, then a name,
# then a comma -- because the library's line names the vocabulary ("internal
# names") and not the syntax.
#
# `none` IS THE LIBRARY'S TO SAY, AND IT SAYS IT HERE AND NOT ON THE PACK LIST.
# The word empties the list and a balancer part becomes free to craft, with the
# engine's derived recycling recipe gone too; that is
# agents/migration-assessment-2.md finding 18. The composed format line under
# this entry closes HALF of it and says so in as many words: it is exactly
# " The word none empties the list, so the recipe costs nothing to craft.",
# and the recycling recipe is nowhere in it. That half is disclosed in the
# changelog and in README.md instead, which is where a player who is about to
# type the word is likelier to meet it than in a tooltip they have already
# read past. The pack list's own parser turns the word down,
# so the line composed there leaves it out. Saying it in either entry would
# duplicate the library on one field and contradict it on the other.
#
# The key is the setting's EMITTED name, the generated one; the section above
# says why these four carry the mod prefix and the two dropdowns do not.
better-belt-balancer-recipe-ingredients=What a balancer part is made of. Write the amount, then the item's internal name, and separate ingredients with commas: 2 iron-plate, 1 splitter. Internal names are the ones the game uses in its own data and in rich text, not the names shown on screen. The tooltip on the setting above lists every preset written this way, which is where to copy one from.
# WHERE THE RESEARCH SITS IS NOT A SEPARATE CHOICE AND CANNOT COME APART FROM
# THE PRICE. Every value this dropdown allows names a source technology, that
# source is the sole prerequisite, and that source's unit is the cost -- so
# repricing the research moves it in the tree, by construction. The stepping
# down is TechLadder in guest/go/tune/tech.go: `logistics-3` tries 3, then 2,
# then 1, `logistics-2` tries 2 then 1, and `logistics` tries only itself. When
# no rung of the chosen ladder carries a unit at all, FallbackUnit() in
# guest/go/tune/plan.go is the price -- 20 units of automation science at 15
# seconds each, which is what the base game charges for Logistics -- and the
# technology is emitted with no prerequisite, because there is no source left
# to hang it off.
#
# THE THREE FIELDS BELOW ARE NOT AN OPTION UP HERE, AND THE LIBRARY NAMES ONLY
# ONE OF THEM. What FkRecipes composes onto this tooltip, under the three preset
# lines and read out of the engine's own settings dump, is exactly one sentence:
# `The setting below applies instead while it does not say default.` It is
# SINGULAR, it is built from the PACK TEXT alone (FkRecipes go/customize.go
# composes it from CustomCost.Packs and from nothing else), and its switch is
# the word `default`. Three rows sit below this one and two of them switch on 0,
# so that line cannot be read as covering them, and an entry that left the three
# to it would tell a player about one field and leave the other two invisible.
# This entry therefore enumerates all three in the new vocabulary. The overlap
# on the pack text is deliberate and is not a repetition: the composed line
# names no field, and the whole difficulty is that "the setting below" is three
# settings here.
#
# THIS ENTRY CARRIES NO WRAP LINE, and that is the library's rule rather than an
# omission: a cost preset renders a localised label and a localised technology
# name, with nothing in it for a player to copy, so only the ingredient dropdown
# and the two text fields get the sentence about a list continuing on the next
# line.
bbb-tech-cost=Which logistics tier the balancer's own research is priced like. The cost is copied from that technology, so it follows whatever your mods charge, and the research sits just after it in the technology tree. A tier your mods leave unpriced steps down to the next belt tier, and where that runs out the research takes 20 units of automation science at 15 seconds each with no prerequisite. The three settings below override that tier one field at a time: the science packs while that field does not say default, the unit count and the seconds while either is not 0.
# THE PACK LIST IS THE OTHER FREE-TEXT FIELD, so this entry is REQUIRED for the
# same reason the recipe's is: it is the only place the format is explained, and
# `go test ./tune/` reports it missing by name. What is different from the
# recipe field is the vocabulary -- research takes science packs and nothing
# else, so an ordinary item cannot be used here even though the recipe field
# would take it -- and that is the one thing a player cannot guess from the
# recipe field they have already used. It is also what stands in for `none`
# here: the library composes that word onto the ingredient field and
# deliberately not onto this one, because this field's parser refuses it with
# `research takes at least one science pack`.
#
# SIX COMPOSED LINES FOLLOW THIS ENTRY, the same six the recipe field carries
# minus the `none` clause and with the LADDER LINE in the pack vocabulary (a
# pack it offers nothing for is left out, two that land on one pack have their
# amounts added, and the research can take fewer packs than the list shows),
# with the declared list as
# `default: 1 automation-science-pack`. The text below repeats none of them and
# is shorter than it was for that reason. It does still spell out the SHAPE --
# an amount, then a name, then a comma -- because the library's line names the
# vocabulary ("internal names") and not the syntax. The key is the generated
# name, as the recipe field's above is.
better-belt-balancer-tech-packs=What the balancer research is paid in. Write the amount, then the pack's internal name, and separate packs with commas: 1 automation-science-pack, 1 logistic-science-pack. Only science packs are accepted, and internal names are the ones the game uses in its own data and in rich text, not the names shown on screen.
# The two numbers are one sentence each, and one sentence is now the whole of
# what they owe. FkRecipes composes the RANGE and the meaning of 0 under each
# of them -- `A whole number from 0 to 1000000. While it is 0 the option chosen
# above decides.` and the same wording for 0 to 3600 -- so the entry says what
# the number IS and stops, and a player who sets one and sees nothing change is
# answered by the line under it. That composed line is also what closes the
# open half of agents/migration-assessment-2.md finding 9, which was the two
# ranges appearing in words nowhere a player reads. Both keys are generated
# names, as the two text fields' above are.
better-belt-balancer-tech-count=How many units of science the balancer research costs.
better-belt-balancer-tech-seconds=How many seconds one unit of the balancer research takes in a lab.
# Why it is off by default, in the player's terms rather than in the engine's:
# what it costs is that the balancers built with it stop working the day the
# game updates. The setting is not defined at all on 2.1, so nobody reading this
# is on an engine where it could be turned on and then break.
bbb-multi-edge-parts=Off by default. A balancer part normally connects to one belt. Factorio 2.0 can connect several belts to one part, which builds a smaller balancer -- but Factorio 2.1 cannot, and balancers built this way stop working when the game updates. This mod turns it on by itself for a save that already used it.

# EVERY ALLOWED VALUE OF EVERY STRING SETTING NEEDS AN ENTRY HERE, one per
# value, keyed `<setting>-<value>`. There is NO FALLBACK: a value with no entry
# renders in the settings menu the player is standing in as
# `Unknown key: "string-mod-setting.bbb-recipe-cost-cheap"` -- the same defect
# the entity names at the top of this file were added for after a field report
# on 2026-08-05, and one nothing headless can see, because --dump-data does not
# read locale and no suite opens a menu. `go test ./tune/` checks this section
# against the allowed values in BOTH directions, so a missing entry and a
# renamed option both fail the build rather than the menu.
#
# AN OPTION LABEL IS A NAME, AND FkRecipes WRITES THE LIST BESIDE IT. Each
# label below is what that option is CALLED and nothing more; what it is made
# of, or what it is priced like, is on the line the library composes next to it
# in the setting's own tooltip. For a recipe preset that is an indented second
# line in the internal names the text field takes, `  type: 4 iron-plate, 2
# iron-gear-wheel, 2 transport-belt`; for a research tier the library extends
# the label's own line with `: cost of <technology>`, read out of the game
# rather than written down here. Both shapes were read out of the engine's own
# settings dump, where neither depends on this file: the `type:` line is
# internal names always and the `: cost of` half is the technology's own name.
# FkRecipes docs/usage.md states the rule for an author:
# "Give a dropdown option a short name, not a sentence", because every
# character of the label is a character the composed list has to give back
# against a tooltip wrap threshold it measured near 57 to 60 characters.
#
# THIS REVERSES THE ANSWER THIS FILE HAS HELD SINCE 0.2.1, WHICH WAS TO SPELL
# THE INGREDIENTS OUT IN DISPLAY NAMES ("Default: 4 iron plates, 2 gears, 2
# transport belts"). All nine labels are byte-identical from 0.2.1 through the
# commit before this one: the block they live in md5s the same at 0.2.1, 0.2.2,
# 0.3.1 and 0.3.2 and at this file's previous head, and `git tag --contains
# 4171bc3`, the commit that added them, names those four releases. That answer
# rested on the label being the only place a player could see a preset before
# committing to it, which stopped being true the moment the library began
# composing the preset's own list beside it. Its measurement was about LENGTH
# and it still holds: rewriting the six presets in INTERNAL names would have
# made three of them longer (58, 66 and 73), so they were kept. Rewriting them
# as NAMES makes all six shorter, so length no longer decides anything, and
# what settles it is the duplication below.
#
# THREE THINGS THE OLD SHAPE COST, each of them measured.
#
# IT SAID ONE LIST TWICE IN TWO VOCABULARIES. `Default: 4 iron plates, 2 gears,
# 2 transport belts` sat directly above `  type: 4 iron-plate, 2
# iron-gear-wheel, 2 transport-belt`, which is the same recipe in the only
# spelling the field accepts. Two lines for one fact, and the first of them the
# half a player cannot paste.
#
# IT PUT ALMOST EVERY LABEL PAST THE TRUNCATION. The client truncates the
# CLOSED dropdown by pixel width near 37 characters (finding 5 of
# agents/migration-assessment-2.md saw `Custom: the ingredients written in t`,
# 36 characters of a 52-character label; the first assessment saw 38 of a
# different one, at one UI scale). Counted over this file before the rewrite,
# EIGHT OF THIS MOD'S NINE dropdown labels were at or past it: the six presets
# ran 35, 38, 50, 52, 58 and 65, only `splitter` at 35 was under, and all
# three of `bbb-tech-cost`'s were over at 43, 45 and 46. Five of the seven
# options in the OPEN list were truncated with an ellipsis too, which is the
# list a player actually chooses from (that seven is `bbb-recipe-cost` as it
# stood while `custom` was its seventh value; it has six now). What that same
# measurement records beside it is the mitigation: hovering a truncated option
# shows its full label in a tooltip. After the rewrite the nine run 5 to 19,
# and the widest of them is exactly half of the widest reading of the
# truncation:
#
#   vanilla       50 -> 7      splitter-express   52 -> 16
#   cheap         38 -> 5      logistics          45 -> 19
#   belt-fast     58 -> 10     logistics-2        43 -> 11
#   belt-express  65 -> 13     logistics-3        46 -> 11
#   splitter      35 -> 8
#
# NOT MEASURED: WHETHER ANY OF THE NINE RENDERS WHOLE ON A CLIENT. No client
# was run here and none was started, which is the same thing
# agents/fkrecipes-migration.md says of the tooltip it measured. The cut is by
# pixel width, the whole of the evidence for the width is two client readings
# of two different labels, and every number above is a character count.
#
# AND A DISPLAY-NAME LABEL WAS A TRAP THE FIELD BESIDE IT COULD SPRING. A
# player who copied `4 iron plates` out of the label they were on got `no item
# or fluid is named "iron plates"; did you mean iron-plate` -- a good answer to
# a question this mod should never have asked. No label spells a LIST in
# display names any more, and the only ingredient list on the screen is the one
# the field takes. TWO LABELS ARE STILL DISPLAY NAMES, which is worth saying
# because it is checkable: `Splitter` and `Express splitter` are base's own
# names for those entities, the parser matches unfolded, and `1 Splitter` still
# answers `no item or fluid is named "Splitter"; did you mean splitter`. What
# changed is that no label now reads as a list somebody could paste whole.
#
# WHAT THE REWRITE DOES NOT FIX IS THE WRAP. The six `type:` lines are the
# library's and do not move with the labels: measured in the engine's own dump
# they are 57, 38, 62, 66, 32 and 41 characters, so at least the two longest
# still wrap and their continuation still starts at the left margin (the 57 is
# on the low edge of the 57-to-60 threshold, so whether it wraps is open).
# That is finding 5's residue, it is the engine's wrapping, and the library
# discloses it in the same tooltip ("A list too long for one line continues on
# the next; the continuation is part of the same list.").
#
# AND WHAT THE NEW SHAPE COSTS, WHICH IS ONE THING AND IS REAL. The settings
# screen now names no ingredient in the words the game shows. A player who
# knows a gear as a gear and not as `iron-gear-wheel` has nothing on that
# screen left to read: the labels are names, the `type:` lines are internal
# names, and the field takes internal names. Three things blunt it and none of
# them erases it. The closed dropdown was cutting the display half near 37
# characters anyway, so what is lost from that widget is a fragment rather than
# a list. README.md carries the six option-to-ingredients rows in display names
# for a player who wants them before choosing. And Factoriopedia answers the
# question for the recipe a player actually HAS, though it has never shown the
# five they did not pick. The trade taken here is that the screen tells a
# player what the field will accept, and the README tells them what the options
# mean.
#
# THE RESEARCH LABELS DROPPED A CLAIM AS WELL AS A CLAUSE, and that is this
# rewrite's own finding rather than a length decision. `Logistics 2, alongside
# fast transport belts` asserts what BASE's logistics-2 unlocks, in a mod whose
# whole design is to READ a tier's price out of the game instead of writing it
# down; in a pack that repurposed that technology the clause is simply false
# and nothing anywhere could notice. What must survive is the technology's
# NAME: base defines `technology-name.logistics` and neither of the two upgrade
# tiers (agents/migration-assessment-2.md finding 15), so the composed half
# renders the raw `logistics-2` and `logistics-3`, and IN THIS TOOLTIP the
# label is the only readable name a player gets for them. That scope is
# deliberate: what the technology tree and Factoriopedia show for a
# numeric-suffix technology is a separate question and no client was run here.
# The three composed lines now read `Logistics (default): cost of Logistics`
# (38 characters), `Logistics 2: cost of logistics-2` and `Logistics 3: cost of
# logistics-3` (32 each), all three under the wrap threshold, where the three
# ran 64, 64 and 67.
#
# THE DEFAULT ROW IS MARKED IN BOTH DROPDOWNS, AND THE TWO ARE MARKED
# DIFFERENTLY ON PURPOSE. Nothing the library composes says which value is the
# default: the recipe dropdown's description is a head line, six label-and-
# `type:` pairs, the wrap line and the switch line, and the research
# dropdown's is a head line, three tier lines and the switch line. This mod's
# own `bbb-recipe-cost` entry says "The default is what this mod has always
# used", a sentence that needs the row to be findable; `bbb-tech-cost` has no
# such sentence, so there the marker stands on its own and has to carry itself.
#
# The recipe default has no name but that word -- it is this mod's own recipe
# and nothing else -- so its label is the bare `Default`. The research default
# HAS a name, and the marker rides beside it in parentheses rather than ahead
# of it behind a colon. `Default: Logistics` was written first and measured
# against `Logistics (default)`: 18 characters against 19, composing to 37
# against 38, both far under any reading of the truncation and both saying
# Logistics twice, so neither length nor duplication separates them. What
# separates them is the colon. On a COST dropdown the library's own
# composition appends `: cost of <technology>` to the label, so a label
# carrying its own colon puts two of them on one line doing two different jobs
# (`Default: Logistics: cost of Logistics`), and the seam between what this
# file wrote and what the library added stops being readable. The parenthetical
# cannot collide, and it puts the NAME at the head of the line, which is the
# half a truncation would keep. An INGREDIENT preset has no such constraint,
# because its composed half opens a new line.
#
# WHICH ADOPTION LIST, BECAUSE FkRecipes HAS WRITTEN TWO UNDER THE SAME
# HEADING. Fix round 1's list is where the label question lives, as item 4,
# "(h) Leave the preset labels alone, or rewrite them, but decide it" -- the
# citation the block this replaces carried, and it was correct. FIX ROUND 2's
# list, the one this round adopted, does not carry the question at all: its
# item 4 is `CustomCost.Seconds` taking an `IntSettingRef`. So round 1 asked
# for a decision, 0.3.3 answered KEEP, and this commit answers it again with
# the round-2 composition in front of it. The guidance it is answered against
# is docs/usage.md's, quoted above, and the library's own
# agents/implementation-notes.md records the one-line `<label>: <typeable
# list>` shape as rejected on arithmetic, which is why the two lines below stay
# two lines.
[string-mod-setting]
bbb-recipe-cost-vanilla=Default
bbb-recipe-cost-cheap=Cheap
bbb-recipe-cost-belt-fast=Fast belts
bbb-recipe-cost-belt-express=Express belts
bbb-recipe-cost-splitter=Splitter
bbb-recipe-cost-splitter-express=Express splitter
bbb-tech-cost-logistics=Logistics (default)
bbb-tech-cost-logistics-2=Logistics 2
bbb-tech-cost-logistics-3=Logistics 3
